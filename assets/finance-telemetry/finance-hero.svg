<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="Linus">
  
  <style>
    .ui { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .display { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .eyebrow { fill: #FAFAFA; font-size: 12px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; }
    .title { fill: #FAFAFA; font-size: 31px; font-weight: 700; }
    .subtitle { fill: #D4D4D4; font-size: 15px; }
    .label { fill: #A8A8A8; font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }
    .value { fill: #FFFFFF; font-size: 28px; font-weight: 700; }
    .muted { fill: #8C8C8C; font-size: 12px; }
    .grid-label { fill: #9E9E9E; font-size: 11px; }
  </style>

  <rect width="920" height="260" rx="24" fill="#020202" />
  <rect x="20" y="20" width="880" height="220" rx="18" fill="#080808" stroke="#2D2D2D" />
  <line x1="40" y1="42" x2="880" y2="42" stroke="#1F1F1F" />
  <line x1="486" y1="60" x2="486" y2="220" stroke="#181818" />

  <text x="52" y="66" class="mono eyebrow">PRIVATE BUILDER / FINANCE AI / GERMANY</text>
  <text x="52" y="118" class="display" fill="#FFFFFF" font-size="52">Linus</text>
  <text x="54" y="144" class="mono" fill="#8F8F8F" font-size="17">@Linux5Real</text>

  <text x="52" y="182" class="ui" fill="#D8D8D8" font-size="16">Building private finance AI systems for market context,</text>
  <text x="52" y="206" class="ui" fill="#D8D8D8" font-size="16">execution workflow, and sharper trading decisions.</text>

  <rect x="52" y="214" width="394" height="12" fill="#111111" rx="4" />
  <text x="64" y="223" class="mono" fill="#F3F3F3" font-size="10">PRIVATE SYSTEMS :: MARKET CONTEXT :: EXECUTION DISCIPLINE</text>

  <rect x="522" y="64" width="322" height="44" rx="12" fill="#060606" stroke="#222222" />
  <text x="540" y="84" class="mono eyebrow">FOCUS</text>
  <text x="540" y="99" class="ui muted">Finance AI, market context, execution workflow.</text>

  <rect x="522" y="118" width="322" height="44" rx="12" fill="#060606" stroke="#222222" />
  <text x="540" y="138" class="mono eyebrow">STACK</text>
  <text x="540" y="153" class="ui muted">Python, JavaScript, Linux, Git, PostgreSQL.</text>

  <rect x="522" y="172" width="322" height="44" rx="12" fill="#060606" stroke="#222222" />
  <text x="540" y="192" class="mono eyebrow">CURRENT BUILD</text>
  <text x="540" y="207" class="ui muted">Gemini 3 Flash / private trading desk.</text>
</svg>
