name: Regenerate Telemetry Images

on:
  push:
    paths:
      - 'assets/finance-telemetry/finance-repo-telemetry.json'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Generate Images
        run: python scripts/generate_images.py

      - name: Commit updated Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/finance-telemetry/*.png
          git diff --cached --quiet || git commit -m "chore: regenerate telemetry PNGs [skip ci]"
          git push
